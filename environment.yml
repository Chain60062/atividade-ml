# Ambiente conda da atividade.
# Criar:   conda env create -f environment.yml
# Ativar:  conda activate atividade-ml
name: atividade-ml
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.13
  - scikit-learn>=1.3
  - jupyterlab>=4.0
  - ipykernel>=6.0
